name: Deploy TWBC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NUXT_I18N_BASE_URL: https://twbronycon.org
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
        id: pages
      # Update these pins when releasing a year site. Cloudflare previews are independent.
      - uses: actions/checkout@v7
        with:
          repository: TW-BronyCon/2026-ManeSite
          ref: e15aecceee265c4efa028ac8a0b8b91ea2a025d0
          path: sources/2026
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: TW-BronyCon/2027-Manesite
          ref: ddf2a08137a4bac47f13cd3f1e1e88f0bc1d36ee
          path: sources/2027
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: sources/2026/.node-version
          cache: npm
          cache-dependency-path: sources/2026/package-lock.json
      - run: npm ci && npm run generate
        working-directory: sources/2026
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/2026/
      - uses: actions/setup-node@v7
        with:
          node-version-file: sources/2027/.node-version
          cache: npm
          cache-dependency-path: sources/2027/package-lock.json
      - run: npm ci && npm run build
        working-directory: sources/2027
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/2027/
      - name: Assemble root and year sites
        run: bash scripts/assemble.sh sources/2026/.output/public sources/2027/.output/public "$RUNNER_TEMP/twbc-pages"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/twbc-pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
