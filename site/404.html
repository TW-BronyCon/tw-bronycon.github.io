<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const { pathname } = window.location;
      const english = pathname === '/en' || pathname.startsWith('/en/') ||
        pathname === '/2027/en' || pathname === '/2027/en/';
      const destination = english ? '/2027/en/' : '/2027/';

      // If the destination itself returns a 404, show the link rather than looping.
      if (pathname !== destination && `${pathname}/` !== destination) {
        document.documentElement.hidden = true;
        window.location.replace(destination);
      } else if (english) {
        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('homepage').href = destination;
        });
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taiwan BronyCon</title>
    <style>
      :root {
        background: #151517;
        color: #fff;
        color-scheme: dark;
      }
    </style>
    <script async src="https://www.googletagmanager.com/gtm.js?id=G-QN69QWDCDV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
    </script>
  </head>
  <body>
    <p>Page not found. Visit the <a id="homepage" href="/2027/">Taiwan BronyCon 2027 homepage</a>.</p>
  </body>
</html>
