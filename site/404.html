<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taiwan BronyCon</title>
    <style>
      :root {
        background: #151517;
        color: #fff;
        color-scheme: dark;
      }
    </style>
    <script async src="https://www.googletagmanager.com/gtm.js?id=G-QN69QWDCDV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
    </script>
  </head>
  <body>
    <p>Page not found. Visit the <a id="homepage" href="/2027/">Taiwan BronyCon 2027 homepage</a>.</p>
    <script>
      const homepage = document.getElementById('homepage');
      const { pathname } = window.location;
      if (pathname === '/en' || pathname.startsWith('/en/') ||
          pathname === '/2027/en' || pathname === '/2027/en/') {
        homepage.href = '/2027/en/';
      }
      // If the destination itself returns a 404, leave the link visible instead of looping.
      if (pathname !== homepage.pathname && `${pathname}/` !== homepage.pathname) {
        window.location.replace(homepage.href);
      }
    </script>
  </body>
</html>
